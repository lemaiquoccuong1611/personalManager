<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Flow — Quản lý lịch làm việc cá nhân</title>
<meta name="theme-color" content="#2E5FF0">
<meta name="description" content="Ứng dụng quản lý lịch làm việc cá nhân: Dashboard, Lịch, Công việc, Ghi chú, Pomodoro, Mục tiêu.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<style>
  :root{
    --radius-lg:18px; --radius-md:12px; --radius-sm:8px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
  }
  #app-root{
    --bg:#F6F8FB; --bg-elev:#FFFFFF; --card:#FFFFFF; --border:#E7ECF3;
    --text:#0F172A; --text-soft:#5B6577; --text-faint:#98A2B3;
    --accent:#2E5FF0; --accent-soft:#EAF0FF; --accent-dark:#1E46C7;
    --shadow-sm: 0 1px 2px rgba(16,24,40,0.04);
    --shadow-md: 0 4px 14px rgba(16,24,40,0.07);
    --shadow-lg: 0 12px 32px rgba(16,24,40,0.12);
    --high:#EF4B4B; --high-bg:#FDECEC;
    --med:#F0A020; --med-bg:#FDF3E3;
    --low:#22B07D; --low-bg:#E7F8F1;
    --ppc:#2E5FF0; --it:#8B5CF6; --tiktok:#F0782E; --personal:#64748B;
  }
  #app-root[data-theme="dark"]{
    --bg:#0D1420; --bg-elev:#131C2B; --card:#131C2B; --border:#22304A;
    --text:#EAF0FB; --text-soft:#94A3BC; --text-faint:#5B6B87;
    --accent:#5B85FF; --accent-soft:rgba(91,133,255,0.14); --accent-dark:#7C9DFF;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
    --shadow-md: 0 6px 18px rgba(0,0,0,0.32);
    --shadow-lg: 0 16px 40px rgba(0,0,0,0.45);
    --high:#FF6B6B; --high-bg:rgba(255,107,107,0.12);
    --med:#FFB648; --med-bg:rgba(255,182,72,0.12);
    --low:#3FD79A; --low-bg:rgba(63,215,154,0.12);
    --ppc:#5B85FF; --it:#A78BFA; --tiktok:#FF9A56; --personal:#8B96AB;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--font);}
  #app-root{background:var(--bg); color:var(--text); min-height:100vh; transition:background .25s ease,color .25s ease;}
  button, input, textarea, select{font-family:var(--font); color:inherit;}
  button{cursor:pointer; border:none; background:none;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

  .shell{display:flex; min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:232px; flex-shrink:0; background:var(--bg-elev); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:22px 16px; position:sticky; top:0; height:100vh;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:0 8px 24px; }
  .brand-mark{width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg,var(--accent),var(--accent-dark)); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm); flex-shrink:0;}
  .brand-name{font-weight:800; font-size:18px; letter-spacing:-0.02em;}
  .nav{display:flex; flex-direction:column; gap:2px; flex:1;}
  .nav-item{
    display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:var(--radius-sm);
    font-size:14px; font-weight:500; color:var(--text-soft); transition:all .15s ease; text-align:left; width:100%;
  }
  .nav-item:hover{background:var(--accent-soft); color:var(--text);}
  .nav-item.active{background:var(--accent); color:#fff; font-weight:600; box-shadow:var(--shadow-sm);}
  .nav-item svg{flex-shrink:0;}
  .sidebar-foot{padding:12px 8px 0; border-top:1px solid var(--border); margin-top:10px;}
  .streak{font-size:12px; color:var(--text-faint); display:flex; align-items:center; gap:6px; padding-top:12px;}
  .sync-row{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--text-faint); font-weight:600; padding-top:10px; word-break:break-all;}
  .logout-btn{margin-top:8px; font-size:11.5px; font-weight:700; color:var(--text-soft); display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:8px; width:100%;}
  .logout-btn:hover{background:var(--accent-soft); color:var(--accent);}

  /* Topbar */
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--bg); backdrop-filter:blur(8px);
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:20px 28px 14px;
  }
  .page-title{font-size:22px; font-weight:800; letter-spacing:-0.02em;}
  .page-sub{font-size:13px; color:var(--text-faint); margin-top:2px; font-weight:500;}
  .topbar-right{display:flex; align-items:center; gap:10px;}
  .searchbox{
    display:flex; align-items:center; gap:8px; background:var(--bg-elev); border:1px solid var(--border);
    border-radius:10px; padding:8px 12px; width:220px; color:var(--text-faint); font-size:13px;
  }
  .searchbox input{background:none; border:none; outline:none; width:100%; font-size:13px; color:var(--text);}
  .icon-btn{
    width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    background:var(--bg-elev); border:1px solid var(--border); transition:all .15s ease; color:var(--text-soft);
  }
  .icon-btn:hover{border-color:var(--accent); color:var(--accent); transform:translateY(-1px);}
  .btn-primary{
    display:flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-weight:600; font-size:13.5px;
    padding:10px 16px; border-radius:10px; box-shadow:var(--shadow-sm); transition:all .15s ease;
  }
  .btn-primary:hover{background:var(--accent-dark); transform:translateY(-1px); box-shadow:var(--shadow-md);}

  .content{padding:6px 28px 100px; flex:1; animation:fadeIn .35s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm); transition:box-shadow .2s ease, transform .2s ease;
  }
  .card-pad{padding:20px;}
  .section-title{font-size:15px; font-weight:700; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between;}

  /* Dashboard */
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px;}
  .stat-card{padding:18px 20px;}
  .stat-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .stat-icon{width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center;}
  .stat-value{font-size:26px; font-weight:800; letter-spacing:-0.02em;}
  .stat-label{font-size:12.5px; color:var(--text-faint); font-weight:600; margin-top:2px;}
  .dash-grid{display:grid; grid-template-columns:1.4fr 1fr; gap:16px;}
  .dash-col{display:flex; flex-direction:column; gap:16px;}

  .upcoming-item{
    display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--border);
  }
  .upcoming-item:last-child{border-bottom:none;}
  .up-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .up-title{font-size:13.5px; font-weight:600;}
  .up-meta{font-size:11.5px; color:var(--text-faint); margin-top:2px;}
  .badge{
    font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em;
  }

  /* Tabs / segmented control */
  .segmented{display:inline-flex; background:var(--bg-elev); border:1px solid var(--border); border-radius:10px; padding:3px;}
  .seg-btn{padding:7px 14px; border-radius:8px; font-size:12.5px; font-weight:600; color:var(--text-soft);}
  .seg-btn.active{background:var(--accent); color:#fff;}

  /* Calendar */
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
  .cal-nav{display:flex; align-items:center; gap:10px;}
  .cal-title{font-size:16px; font-weight:700; min-width:150px; text-align:center;}
  .month-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:8px;}
  .weekday-label{font-size:11px; font-weight:700; color:var(--text-faint); text-align:center; padding-bottom:6px; text-transform:uppercase;}
  .day-cell{
    min-height:96px; border-radius:12px; border:1px solid var(--border); padding:8px; background:var(--bg-elev);
    cursor:pointer; transition:all .15s ease; display:flex; flex-direction:column; gap:4px;
  }
  .day-cell:hover{border-color:var(--accent); transform:translateY(-1px);}
  .day-cell.muted{opacity:.35;}
  .day-cell.today{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft);}
  .day-cell.selected{background:var(--accent-soft); border-color:var(--accent);}
  .day-num{font-size:12.5px; font-weight:700;}
  .day-dot-row{display:flex; gap:3px; flex-wrap:wrap;}
  .day-dot{width:6px; height:6px; border-radius:50%;}
  .week-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:10px;}
  .week-col-head{font-size:12px; font-weight:700; text-align:center; padding-bottom:8px; color:var(--text-soft);}
  .week-col{display:flex; flex-direction:column; gap:6px; min-height:120px;}
  .agenda-row{display:flex; gap:14px; padding:12px 6px; border-bottom:1px solid var(--border); align-items:flex-start;}
  .agenda-row:last-child{border-bottom:none;}
  .agenda-time{font-size:12px; font-weight:700; color:var(--text-faint); width:52px; flex-shrink:0; padding-top:2px;}

  /* Task mini card (calendar/week) */
  .mini-task{
    font-size:10.5px; font-weight:600; padding:3px 6px; border-radius:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* Kanban */
  .kanban{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; align-items:start;}
  .kanban-col{background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px; min-height:200px;}
  .kanban-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; padding:0 4px;}
  .kanban-head-title{font-size:13px; font-weight:700; display:flex; align-items:center; gap:8px;}
  .kanban-count{font-size:11px; font-weight:700; color:var(--text-faint); background:var(--bg); padding:2px 8px; border-radius:20px;}
  .kanban-dropzone{min-height:60px; border-radius:10px; transition:background .15s ease;}
  .kanban-dropzone.drag-over{background:var(--accent-soft); outline:2px dashed var(--accent);}
  .task-card{
    background:var(--card); border:1px solid var(--border); border-radius:12px; padding:13px 14px; margin-bottom:10px;
    cursor:grab; transition:all .15s ease;
  }
  .task-card:hover{box-shadow:var(--shadow-md); transform:translateY(-2px);}
  .task-card:active{cursor:grabbing;}
  .task-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .task-title{font-size:13.5px; font-weight:600; line-height:1.4;}
  .task-title.done{text-decoration:line-through; color:var(--text-faint);}
  .task-desc{font-size:12px; color:var(--text-faint); margin-top:4px; line-height:1.4;}
  .task-foot{display:flex; align-items:center; justify-content:space-between; margin-top:10px;}
  .task-tags{display:flex; gap:6px; flex-wrap:wrap;}
  .cat-tag{font-size:10px; font-weight:700; padding:3px 7px; border-radius:6px;}
  .task-actions{display:flex; gap:4px; opacity:0; transition:opacity .15s ease;}
  .task-card:hover .task-actions{opacity:1;}
  .mini-icon-btn{width:24px; height:24px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--text-faint);}
  .mini-icon-btn:hover{background:var(--bg); color:var(--accent);}
  .task-due{font-size:11px; color:var(--text-faint); font-weight:600; display:flex; align-items:center; gap:4px;}
  .task-due.overdue{color:var(--high);}

  /* Notes */
  .notes-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px;}
  .note-card{padding:16px; display:flex; flex-direction:column; gap:8px; min-height:140px;}
  .note-title{font-size:14px; font-weight:700;}
  .note-body{font-size:12.5px; color:var(--text-soft); line-height:1.5; flex:1; white-space:pre-wrap; word-break:break-word;}
  .note-date{font-size:10.5px; color:var(--text-faint); font-weight:600;}
  .note-actions{display:flex; gap:6px; justify-content:flex-end;}
  .add-note-card{
    border:2px dashed var(--border); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px;
    color:var(--text-faint); font-weight:600; font-size:13px; min-height:140px; cursor:pointer; transition:all .15s ease;
  }
  .add-note-card:hover{border-color:var(--accent); color:var(--accent);}

  /* Pomodoro */
  .pomo-wrap{display:flex; flex-direction:column; align-items:center; padding:40px 20px; gap:22px;}
  .pomo-modes{display:flex; gap:8px;}
  .pomo-ring{position:relative; width:260px; height:260px;}
  .pomo-time{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .pomo-time-txt{font-size:44px; font-weight:800; letter-spacing:-0.02em; font-variant-numeric:tabular-nums;}
  .pomo-time-label{font-size:12px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; margin-top:4px;}
  .pomo-controls{display:flex; gap:12px;}
  .pomo-btn{
    width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--accent); color:#fff; box-shadow:var(--shadow-md); transition:all .15s ease;
  }
  .pomo-btn.secondary{background:var(--bg-elev); color:var(--text-soft); border:1px solid var(--border); width:46px; height:46px;}
  .pomo-btn:hover{transform:scale(1.06);}
  .pomo-stats{display:flex; gap:28px; margin-top:6px;}
  .pomo-stat{text-align:center;}
  .pomo-stat-val{font-size:20px; font-weight:800;}
  .pomo-stat-label{font-size:11px; color:var(--text-faint); font-weight:600;}

  /* Goals */
  .goals-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px;}
  .goal-card{padding:18px;}
  .goal-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .goal-title{font-size:14px; font-weight:700;}
  .progress-track{height:8px; border-radius:20px; background:var(--bg); overflow:hidden; margin:10px 0 8px;}
  .progress-fill{height:100%; border-radius:20px; background:linear-gradient(90deg,var(--accent),var(--accent-dark)); transition:width .4s ease;}
  .goal-nums{display:flex; justify-content:space-between; font-size:12px; color:var(--text-faint); font-weight:600;}

  /* Stats */
  .stats-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(10,14,25,0.45); backdrop-filter:blur(2px); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeIn .2s ease;
  }
  .modal{
    background:var(--card); border-radius:20px; width:100%; max-width:440px; box-shadow:var(--shadow-lg);
    max-height:88vh; overflow-y:auto; animation:modalIn .22s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes modalIn{from{opacity:0; transform:scale(.94) translateY(8px);} to{opacity:1; transform:scale(1) translateY(0);}}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border);}
  .modal-title{font-size:16px; font-weight:700;}
  .modal-body{padding:18px 20px; display:flex; flex-direction:column; gap:14px;}
  .field-label{font-size:12px; font-weight:700; color:var(--text-soft); margin-bottom:6px; display:block;}
  .field-input, .field-select, .field-textarea{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--bg);
    font-size:13.5px; outline:none; transition:border .15s ease;
  }
  .field-input:focus, .field-select:focus, .field-textarea:focus{border-color:var(--accent);}
  .field-textarea{resize:vertical; min-height:70px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .modal-foot{display:flex; gap:10px; padding:16px 20px; border-top:1px solid var(--border);}
  .btn-ghost{flex:1; padding:11px; border-radius:10px; font-weight:600; font-size:13.5px; background:var(--bg-elev); border:1px solid var(--border); color:var(--text-soft);}
  .btn-ghost:hover{border-color:var(--text-faint);}
  .btn-solid{flex:1; padding:11px; border-radius:10px; font-weight:600; font-size:13.5px; background:var(--accent); color:#fff;}
  .btn-solid:hover{background:var(--accent-dark);}
  .btn-solid:disabled{opacity:.6; cursor:default;}
  .priority-picker{display:flex; gap:8px;}
  .priority-opt{flex:1; padding:9px; border-radius:10px; border:1.5px solid var(--border); text-align:center; font-size:12.5px; font-weight:700;}
  .priority-opt.selected-high{border-color:var(--high); background:var(--high-bg); color:var(--high);}
  .priority-opt.selected-med{border-color:var(--med); background:var(--med-bg); color:var(--med);}
  .priority-opt.selected-low{border-color:var(--low); background:var(--low-bg); color:var(--low);}

  .empty-state{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:50px 20px; color:var(--text-faint); text-align:center; gap:10px;}

  /* Auth gate */
  .auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:var(--bg);}
  .auth-card{width:100%; max-width:380px; background:var(--card); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow-lg); padding:30px 26px; text-align:center;}
  .auth-mark{width:52px; height:52px; border-radius:14px; margin:0 auto 16px; background:linear-gradient(135deg,var(--accent),var(--accent-dark)); display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:var(--shadow-md);}
  .auth-title{font-size:20px; font-weight:800; letter-spacing:-0.02em;}
  .auth-sub{font-size:13px; color:var(--text-faint); margin-top:6px; line-height:1.5;}
  .auth-form{display:flex; flex-direction:column; gap:12px; margin-top:22px;}
  .auth-msg{font-size:12.5px; border-radius:10px; padding:10px 12px; line-height:1.45; text-align:left;}
  .auth-msg.ok{background:var(--low-bg); color:var(--low);}
  .auth-msg.err{background:var(--high-bg); color:var(--high);}
  .auth-skip{margin-top:16px; font-size:12px; color:var(--text-faint); font-weight:600;}
  .auth-skip button{color:var(--accent); font-weight:700; text-decoration:underline;}

  /* Data (Excel) modal rows */
  .data-row{display:flex; align-items:center; gap:12px; padding:14px; border:1px solid var(--border); border-radius:14px;}
  .data-info{flex:1; min-width:0;}
  .data-t{font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:6px;}
  .data-d{font-size:12px; color:var(--text-faint); margin-top:4px; line-height:1.45;}

  /* Mobile "more" bottom sheet */
  .sheet-overlay{position:fixed; inset:0; background:rgba(10,14,25,0.45); backdrop-filter:blur(2px); z-index:120; display:flex; align-items:flex-end; animation:fadeIn .18s ease;}
  .sheet{width:100%; background:var(--card); border-top-left-radius:22px; border-top-right-radius:22px; box-shadow:var(--shadow-lg); padding:10px 18px calc(20px + env(safe-area-inset-bottom)); animation:sheetUp .24s cubic-bezier(.2,.9,.3,1.1);}
  @keyframes sheetUp{from{transform:translateY(100%);} to{transform:translateY(0);}}
  .sheet-grip{width:40px; height:4px; border-radius:4px; background:var(--border); margin:2px auto 14px;}
  .sheet-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}

const { useState, useEffect, useRef, useMemo } = React;

/* ---------- Supabase ---------- */

/* Map giữa object trong app (JS) và hàng trong DB (Postgres) */
const taskToRow = t => ({ title: t.title, description: t.desc || "", date: t.date, time: t.time, priority: t.priority, status: t.status, cat: t.cat });

/* ---------- Icons ---------- */
function Icon({ name, size = 18, strokeWidth = 2 }) {

    case "calendar": return <svg {...p}><rect x="3" y="5" width="18" height="16" rx="2.5"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>;

    case "note": return <svg {...p}><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/><line x1="8" y1="13" x2="15" y2="13"/><line x1="8" y1="17" x2="12" y2="17"/></svg>;

    case "moon": return <svg {...p}><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 6.8 6.8 0 0 0 20 14.5z"/></svg>;
    case "plus": return <svg {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    case "trash": return <svg {...p}><polyline points="3 6 5 6 21 6"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M6 6l1 14a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-14"/></svg>;
    case "edit": return <svg {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>;
    case "x": return <svg {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;

    case "chevronR": return <svg {...p}><polyline points="9 18 15 12 9 6"/></svg>;
    case "search": return <svg {...p}><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.2" y2="16.2"/></svg>;
    case "clock": return <svg {...p}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>;
    case "flame": return <svg {...p}><path d="M12 2s5 4.5 5 9.5a5 5 0 0 1-10 0c0-1.3.6-2.3 1.2-3.2.4.9 1.1 1.4 1.8 1.2C9.4 7.6 9 5.8 9 4.5 10 5 12 2 12 2z"/></svg>;

    case "reset": return <svg {...p}><polyline points="1 4 1 10 7 10"/><path d="M3.5 15a8.5 8.5 0 1 0 2-9L1 10"/></svg>;
    case "alert": return <svg {...p}><path d="M12 3 2 20h20L12 3z"/><line x1="12" y1="10" x2="12" y2="14.5"/><circle cx="12" cy="17.3" r="0.9" fill="currentColor"/></svg>;
    case "download": return <svg {...p}><path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><path d="M5 21h14"/></svg>;
    case "upload": return <svg {...p}><path d="M12 21V9"/><polyline points="7 14 12 9 17 14"/><path d="M5 3h14"/></svg>;
    case "more": return <svg {...p}><circle cx="5" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="19" cy="12" r="1.7" fill="currentColor"/></svg>;
    case "logout": return <svg {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>;
    case "sheet": return <svg {...p}><rect x="3" y="3" width="18" height="18" rx="2.5"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="9" x2="9" y2="21"/></svg>;
    default: return null;
  }
}

/* ---------- Helpers ---------- */
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = new Date();
const todayISO = iso(today);
function addDays(dateStr, n){ const d = new Date(dateStr); d.setDate(d.getDate()+n); return iso(d); }
function fmtShort(dateStr){
  const d = new Date(dateStr);
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`;
}
const WEEKDAYS_VN = ["CN","T2","T3","T4","T5","T6","T7"];
const CATS = { ppc: { label: "PPC Ads", color: "var(--ppc)" }, it: { label: "IT / Hệ thống", color: "var(--it)" }, tiktok: { label: "TikTok Shop", color: "var(--tiktok)" }, personal: { label: "Cá nhân", color: "var(--personal)" } };
const PRI = { high: { label: "Cao", color: "var(--high)", bg: "var(--high-bg)" }, med: { label: "Trung bình", color: "var(--med)", bg: "var(--med-bg)" }, low: { label: "Thấp", color: "var(--low)", bg: "var(--low-bg)" } };
const STATUS_LABEL = { todo: "Cần làm", inprogress: "Đang làm", done: "Hoàn thành" };

/* ---------- Excel import / export ---------- */
const CAT_BY_LABEL = {}; Object.entries(CATS).forEach(([k, v]) => { CAT_BY_LABEL[v.label.toLowerCase()] = k; });
const PRI_BY_LABEL = {}; Object.entries(PRI).forEach(([k, v]) => { PRI_BY_LABEL[v.label.toLowerCase()] = k; });
const STATUS_BY_LABEL = {}; Object.entries(STATUS_LABEL).forEach(([k, v]) => { STATUS_BY_LABEL[v.toLowerCase()] = k; });

function mapCat(v) { if (!v) return "personal"; const s = String(v).trim().toLowerCase(); return CAT_BY_LABEL[s] || (CATS[s] ? s : "personal"); }
function mapPri(v) { if (!v) return "med"; const s = String(v).trim().toLowerCase(); return PRI_BY_LABEL[s] || (PRI[s] ? s : "med"); }
function mapStatus(v) { if (!v) return "todo"; const s = String(v).trim().toLowerCase(); return STATUS_BY_LABEL[s] || (STATUS_LABEL[s] ? s : "todo"); }

function normDate(v) {
  if (!v) return todayISO;
  if (v instanceof Date && !isNaN(v)) return iso(v);
  if (typeof v === "number") { const d = new Date(Math.round((v - 25569) * 86400000)); return isNaN(d) ? todayISO : iso(d); }
  const s = String(v).trim();
  const m = s.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  if (m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  const d = new Date(s); return isNaN(d) ? todayISO : iso(d);
}
function normTime(v) {
  if (!v) return "09:00";
  if (v instanceof Date && !isNaN(v)) return `${pad(v.getHours())}:${pad(v.getMinutes())}`;
  if (typeof v === "number") { const mins = Math.round((v % 1) * 24 * 60); return `${pad(Math.floor(mins / 60))}:${pad(mins % 60)}`; }
  const m = String(v).match(/(\d{1,2}):(\d{2})/);
  return m ? `${pad(+m[1])}:${m[2]}` : "09:00";
}

function exportExcel(tasks, notes, goals) {
  const wb = XLSX.utils.book_new();
  const tRows = tasks.map(t => ({ "Tên công việc": t.title, "Mô tả": t.desc || "", "Ngày (YYYY-MM-DD)": t.date, "Giờ (HH:MM)": t.time, "Mảng": CATS[t.cat] ? CATS[t.cat].label : t.cat, "Ưu tiên": PRI[t.priority] ? PRI[t.priority].label : t.priority, "Trạng thái": STATUS_LABEL[t.status] || t.status }));
  const nRows = notes.map(n => ({ "Tiêu đề": n.title, "Nội dung": n.body || "", "Ngày (YYYY-MM-DD)": n.date }));
  const gRows = goals.map(g => ({ "Tên mục tiêu": g.title, "Hiện tại": g.current, "Mục tiêu": g.target, "Đơn vị": g.unit || "" }));
  const emptyT = [{ "Tên công việc": "", "Mô tả": "", "Ngày (YYYY-MM-DD)": "", "Giờ (HH:MM)": "", "Mảng": "", "Ưu tiên": "", "Trạng thái": "" }];
  const emptyN = [{ "Tiêu đề": "", "Nội dung": "", "Ngày (YYYY-MM-DD)": "" }];
  const emptyG = [{ "Tên mục tiêu": "", "Hiện tại": "", "Mục tiêu": "", "Đơn vị": "" }];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(tRows.length ? tRows : emptyT), "Cong viec");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(nRows.length ? nRows : emptyN), "Ghi chu");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(gRows.length ? gRows : emptyG), "Muc tieu");
  XLSX.writeFile(wb, "Flow-" + todayISO + ".xlsx");
}

function pickCol(row, keys, avoid) {
  for (const k of Object.keys(row)) {
    const lk = k.toLowerCase().trim();
    if (avoid && avoid.some(a => lk.includes(a))) continue;
    for (const cand of keys) if (lk.includes(cand)) return row[k];
  }
  return "";
}

async function parseExcelFile(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array", cellDates: true });
  const byName = n => wb.Sheets[n];
  const rowsOf = sh => sh ? XLSX.utils.sheet_to_json(sh, { defval: "" }) : [];
  const tSheet = byName("Cong viec") || wb.Sheets[wb.SheetNames[0]];
  const nSheet = byName("Ghi chu") || wb.Sheets[wb.SheetNames[1]];
  const gSheet = byName("Muc tieu") || wb.Sheets[wb.SheetNames[2]];

  const tasks = rowsOf(tSheet).map(r => {
    const title = String(pickCol(r, ["tên công việc", "tên việc", "tên", "title", "công việc"]) || "").trim();
    if (!title) return null;
    return { title, desc: String(pickCol(r, ["mô tả", "mota", "desc", "chi tiết"]) || ""), date: normDate(pickCol(r, ["ngày", "date"])), time: normTime(pickCol(r, ["giờ", "gio", "time"])), cat: mapCat(pickCol(r, ["mảng", "mang", "cat", "nhóm", "loại"])), priority: mapPri(pickCol(r, ["ưu tiên", "uu tien", "priority"])), status: mapStatus(pickCol(r, ["trạng", "trang", "status"])) };
  }).filter(Boolean);

  const notes = rowsOf(nSheet).map(r => {
    const title = String(pickCol(r, ["tiêu đề", "tieu de", "title", "tên"]) || "").trim();
    if (!title) return null;
    return { title, body: String(pickCol(r, ["nội dung", "noi dung", "body", "ghi chú"]) || ""), date: normDate(pickCol(r, ["ngày", "date"])) };
  }).filter(Boolean);

  const goals = rowsOf(gSheet).map(r => {
    const title = String(pickCol(r, ["tên mục tiêu", "mục tiêu", "muc tieu", "title", "tên"]) || "").trim();
    if (!title) return null;
    return { title, current: Number(pickCol(r, ["hiện tại", "hien tai", "current"])) || 0, target: Number(pickCol(r, ["mục tiêu", "muc tieu", "target"], ["tên", "hiện", "current"])) || 0, unit: String(pickCol(r, ["đơn vị", "don vi", "unit"]) || "") };
  }).filter(Boolean);

  return { tasks, notes, goals };
}

/* ---------- Lịch lặp hàng tuần (weekly recurring) ---------- */
// Thứ -> getDay() (CN=0, T2=1 ... T7=6)
function parseWeekday(v) {
  const s = String(v || "").trim().toLowerCase();
  if (!s) return null;
  if (s.includes("cn") || s.includes("chủ") || s.includes("chu nhat") || s.includes("sun")) return 0;
  const en = { mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };
  for (const k in en) if (s.includes(k)) return en[k];
  const m = s.match(/(\d+)/);
  if (m) { const n = +m[1]; if (n >= 2 && n <= 7) return n - 1; if (n === 1) return 0; }
  return null;
}
function mondayOf(dateStr) { const d = new Date(dateStr); const day = d.getDay(); d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day)); return iso(d); }

function buildWeeklySample() {
  const rows = [];
  const add = (thu, time, title, cat, pri) => rows.push({ "Thứ": thu, "Giờ (HH:MM)": time, "Tên công việc": title, "Mảng": CATS[cat].label, "Ưu tiên": PRI[pri].label });
  add("T2", "08:00", "PPC Ads - Deep work", "ppc", "med");
  add("T2", "08:30", "Họp cả công ty", "personal", "med");
  add("T2", "10:00", "Họp team PPC Ads", "ppc", "high");
  add("T2", "11:00", "TikTok Shop - Deep work", "tiktok", "med");
  add("T2", "11:30", "Họp team TikTok Shop", "tiktok", "med");
  add("T2", "13:30", "IT - Deep work", "it", "med");
  add("T2", "14:00", "Báo cáo Data Ads (tổng hợp)", "ppc", "high");
  add("T2", "14:30", "IT - Deep work", "it", "med");
  add("T2", "17:00", "TikTok Shop - Deep work", "tiktok", "med");
  ["T3", "T4", "T5", "T6"].forEach(d => {
    add(d, "08:00", "PPC Ads - Deep work", "ppc", "med");
    add(d, "11:00", "TikTok Shop - Deep work", "tiktok", "med");
    add(d, "13:30", "IT - Deep work", "it", "med");
    add(d, "14:00", "Báo cáo Data Ads (tổng hợp)", "ppc", "high");
    add(d, "14:30", "IT - Deep work", "it", "med");
    if (d === "T5") add(d, "16:30", "Sync team IT (hàng tuần)", "it", "low");
    add(d, "17:00", "TikTok Shop - Deep work", "tiktok", "med");
  });
  return rows;
}
function exportWeeklyTemplate() {
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(buildWeeklySample()), "Lich lap");
  XLSX.writeFile(wb, "Flow-lich-lap-mau.xlsx");
}
async function parseWeeklyTemplate(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array", cellDates: true });
  const sh = wb.Sheets[wb.SheetNames[0]];
  const rows = sh ? XLSX.utils.sheet_to_json(sh, { defval: "" }) : [];
  return rows.map(r => {
    const title = String(pickCol(r, ["tên công việc", "tên việc", "việc", "title", "tên"]) || "").trim();
    const dow = parseWeekday(pickCol(r, ["thứ", "weekday", "ngày trong tuần"]));
    if (!title || dow == null) return null;
    return { dow, time: normTime(pickCol(r, ["giờ", "gio", "time"])), title, desc: String(pickCol(r, ["mô tả", "desc"]) || ""), cat: mapCat(pickCol(r, ["mảng", "mang", "cat", "loại"])), priority: mapPri(pickCol(r, ["ưu tiên", "priority"])) };
  }).filter(Boolean);
}
function generateFromWeekly(items, startISO, weeks) {
  const mon0 = mondayOf(startISO);
  const out = [];
  for (let w = 0; w < weeks; w++)
    for (const it of items) {
      const offset = it.dow === 0 ? 6 : it.dow - 1;
      out.push({ title: it.title, desc: it.desc || "", date: addDays(mon0, w * 7 + offset), time: it.time, priority: it.priority, status: "todo", cat: it.cat });
    }
  return out;
}

let idCounter = 1000;
const nextId = () => idCounter++;

const seedTasks = [
  { id: nextId(), title: "Build campaign SKC cho ASIN mới", desc: "Exact + Broad + Auto theo Port đã map", date: todayISO, time: "09:00", priority: "high", status: "inprogress", cat: "ppc" },
  { id: nextId(), title: "Báo cáo Data Ads tổng hợp", desc: "Gửi team PPC trước 14h30", date: todayISO, time: "14:00", priority: "med", status: "todo", cat: "ppc" },

/* ---------- Small building blocks ---------- */
function CategoryTag({ cat }) {
  const c = CATS[cat];
  return <span className="cat-tag" style={{ background: c.color + "22", color: c.color }}>{c.label}</span>;
}
function PriorityBadge({ p }) {
  const pr = PRI[p];
  return <span className="badge" style={{ background: pr.bg, color: pr.color }}>{pr.label}</span>;
}

function BarChart({ data, height = 160 }) {
  const max = Math.max(1, ...data.map(d => d.value));
  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 10, height, padding: "0 4px" }}>
      {data.map((d, i) => (
        <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 8 }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: "var(--text-faint)" }}>{d.value}</div>
          <div style={{
            width: "70%", maxWidth: 26, borderRadius: 8,
            height: Math.max(6, (d.value / max) * (height - 46)),
            background: d.highlight ? "linear-gradient(180deg,var(--accent),var(--accent-dark))" : "var(--accent-soft)",
            transition: "height .5s cubic-bezier(.2,.9,.3,1)"
          }} />
          <div style={{ fontSize: 11, fontWeight: 700, color: "var(--text-faint)" }}>{d.label}</div>
        </div>
      ))}
    </div>
  );
}

function Donut({ data, size = 150, thickness = 18 }) {
  const total = Math.max(1, data.reduce((s, d) => s + d.value, 0));
  const r = (size - thickness) / 2;
  const c = 2 * Math.PI * r;
  let offset = 0;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 18, flexWrap: "wrap" }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--bg)" strokeWidth={thickness} />
        {data.map((d, i) => {
          const frac = d.value / total;
          const dash = frac * c;
          const el = (
            <circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={d.color}
              strokeWidth={thickness} strokeDasharray={`${dash} ${c - dash}`} strokeDashoffset={-offset}
              strokeLinecap="butt" style={{ transition: "stroke-dasharray .5s ease" }} />
          );
          offset += dash;
          return el;
        })}
      </svg>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {data.map((d, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12.5 }}>
            <span style={{ width: 9, height: 9, borderRadius: 3, background: d.color, flexShrink: 0 }} />
            <span style={{ color: "var(--text-soft)", fontWeight: 600 }}>{d.label}</span>
            <span style={{ color: "var(--text-faint)" }}>({d.value})</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function CalendarView({ tasks, onEditTask, openNewTask }) {
  const [mode, setMode] = useState("month");
  const [cursor, setCursor] = useState(todayISO);
  const [selected, setSelected] = useState(todayISO);

  const cursorDate = new Date(cursor);
  const monthLabel = cursorDate.toLocaleDateString("vi-VN", { month: "long", year: "numeric" });

  function shift(n) {
    const d = new Date(cursor);
    if (mode === "month") d.setMonth(d.getMonth() + n);
    else if (mode === "week") d.setDate(d.getDate() + n * 7);
    else d.setDate(d.getDate() + n);
    setCursor(iso(d));
  }

  const tasksByDate = useMemo(() => {
    const map = {};
    tasks.forEach(t => { (map[t.date] = map[t.date] || []).push(t); });
    return map;
  }, [tasks]);

  function MonthGrid() {
    const first = new Date(cursorDate.getFullYear(), cursorDate.getMonth(), 1);
    const startOffset = first.getDay();
    const gridStart = new Date(first); gridStart.setDate(gridStart.getDate() - startOffset);
    const cells = [];
    for (let i = 0; i < 42; i++) {
      const d = new Date(gridStart); d.setDate(d.getDate() + i);
      cells.push(d);
    }
    return (
      <div className="month-grid">
        {WEEKDAYS_VN.map(w => <div className="weekday-label" key={w}>{w}</div>)}
        {cells.map((d, i) => {
          const ds = iso(d);
          const inMonth = d.getMonth() === cursorDate.getMonth();
          const dayTasks = tasksByDate[ds] || [];
          return (
            <div key={i}
              className={"day-cell" + (!inMonth ? " muted" : "") + (ds === todayISO ? " today" : "") + (ds === selected ? " selected" : "")}
              onClick={() => setSelected(ds)}>
              <div className="day-num">{d.getDate()}</div>
              <div className="day-dot-row">
                {dayTasks.slice(0,4).map(t => <span key={t.id} className="day-dot" style={{ background: CATS[t.cat].color }} />)}
              </div>
              {dayTasks.length > 0 && <div style={{fontSize:10,color:"var(--text-faint)",fontWeight:700,marginTop:"auto"}}>{dayTasks.length} việc</div>}
            </div>
          );
        })}
      </div>
    );
  }

  function WeekGrid() {
    const d0 = new Date(cursorDate); d0.setDate(d0.getDate() - d0.getDay());

function PomodoroView({ onSessionComplete }) {
  const MODES = { work: { label: "Tập trung", secs: 25*60, color: "var(--accent)" }, short: { label: "Nghỉ ngắn", secs: 5*60, color: "var(--low)" }, long: { label: "Nghỉ dài", secs: 15*60, color: "var(--it)" } };
  const [mode, setMode] = useState("work");
  const [secondsLeft, setSecondsLeft] = useState(MODES.work.secs);
  const [running, setRunning] = useState(false);
  const [sessions, setSessions] = useState(0);
  const intervalRef = useRef(null);

  useEffect(() => {
    if (running) {
      intervalRef.current = setInterval(() => {
        setSecondsLeft(s => {
          if (s <= 1) {
            clearInterval(intervalRef.current);
            setRunning(false);
            if (mode === "work") { setSessions(v=>v+1); onSessionComplete(25); }
            return 0;
          }
          return s - 1;
        });
      }, 1000);
    }
    return () => clearInterval(intervalRef.current);
  }, [running, mode]);

  function switchMode(m) {
    clearInterval(intervalRef.current);
    setRunning(false); setMode(m); setSecondsLeft(MODES[m].secs);
  }
  function reset() { clearInterval(intervalRef.current); setRunning(false); setSecondsLeft(MODES[mode].secs); }

  const total = MODES[mode].secs;
  const pct = 1 - secondsLeft / total;
  const r = 110, c = 2*Math.PI*r;
  const mm = pad(Math.floor(secondsLeft/60)), ss = pad(secondsLeft%60);

  return (
    <div className="card">
      <div className="pomo-wrap">
        <div className="pomo-modes">
          {Object.entries(MODES).map(([k,v]) => (
            <button key={k} className={"seg-btn" + (mode===k?" active":"")} style={mode===k?{background:v.color}:{}} onClick={()=>switchMode(k)}>{v.label}</button>
          ))}
        </div>
        <div className="pomo-ring">
          <svg width="260" height="260" style={{transform:"rotate(-90deg)"}}>
            <circle cx="130" cy="130" r={r} fill="none" stroke="var(--bg)" strokeWidth="14"/>
            <circle cx="130" cy="130" r={r} fill="none" stroke={MODES[mode].color} strokeWidth="14" strokeLinecap="round"
              strokeDasharray={c} strokeDashoffset={c*(1-pct)} style={{transition:"stroke-dashoffset 1s linear"}}/>
          </svg>
          <div className="pomo-time">
            <div className="pomo-time-txt">{mm}:{ss}</div>
            <div className="pomo-time-label">{MODES[mode].label}</div>
          </div>
        </div>
        <div className="pomo-controls">
          <button className="pomo-btn secondary" onClick={reset}><Icon name="reset" size={18}/></button>
          <button className="pomo-btn" onClick={()=>setRunning(r=>!r)}>{running ? <Icon name="pause" size={22}/> : <Icon name="play" size={22}/>}</button>
        </div>
        <div className="pomo-stats">
          <div className="pomo-stat"><div className="pomo-stat-val">{sessions}</div><div className="pomo-stat-label">Phiên hôm nay</div></div>
          <div className="pomo-stat"><div className="pomo-stat-val">{sessions*25}</div><div className="pomo-stat-label">Phút tập trung</div></div>
        </div>
      </div>
    </div>
  );
}

/* ---------- Auth Gate (email + mật khẩu) ---------- */
function AuthGate({ theme, onSkip }) {
  const [mode, setMode] = useState("signin"); // signin | signup
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const [err, setErr] = useState(false);

  function switchMode(m) { setMode(m); setMsg(""); setErr(false); }

  async function submit(e) {
    e.preventDefault();
    const em = email.trim();
    if (!em || !password) return;
    if (password.length < 6) { setErr(true); setMsg("Mật khẩu cần tối thiểu 6 ký tự."); return; }
    setBusy(true); setMsg(""); setErr(false);
    const { data, error } = mode === "signup"
      ? await sb.auth.signUp({ email: em, password })
      : await sb.auth.signInWithPassword({ email: em, password });
    setBusy(false);
    if (error) {
      setErr(true);
      const m = error.message || "";
      if (/already registered|already exists|User already/i.test(m)) setMsg("Email này đã có tài khoản. Hãy chuyển sang tab \"Đăng nhập\".");
      else if (/invalid login credentials/i.test(m)) setMsg("Email hoặc mật khẩu không đúng.");
      else if (/not confirmed|confirm/i.test(m)) setMsg("Tài khoản chưa xác nhận email. Vào Supabase → Authentication → Providers → Email, TẮT \"Confirm email\", rồi thử lại.");
      else setMsg(m);
      return;
    }
    if (mode === "signup" && data && !data.session) {
      setErr(true);
      setMsg("Đã tạo tài khoản nhưng đang bật xác nhận email. Vào Supabase → Authentication → Providers → Email, TẮT \"Confirm email\" để đăng nhập ngay.");
    }
    // Có session → listener onAuthStateChange sẽ tự đưa vào app.
  }

  return (
    <div id="app-root" data-theme={theme}>
      <div className="auth-wrap">
        <div className="auth-card">
          <div className="auth-mark"><Icon name="target" size={26} strokeWidth={2.4} /></div>
          <div className="auth-title">Flow</div>
          <div className="auth-sub">{mode === "signin" ? "Đăng nhập để đồng bộ công việc trên mọi thiết bị." : "Tạo tài khoản mới để bắt đầu."}</div>
          <div className="segmented" style={{ marginTop: 18, width: "100%" }}>
            <button type="button" className={"seg-btn" + (mode === "signin" ? " active" : "")} style={{ flex: 1 }} onClick={() => switchMode("signin")}>Đăng nhập</button>
            <button type="button" className={"seg-btn" + (mode === "signup" ? " active" : "")} style={{ flex: 1 }} onClick={() => switchMode("signup")}>Tạo tài khoản</button>
          </div>
          <form className="auth-form" onSubmit={submit}>
            <input className="field-input" type="email" placeholder="Email (vd: cuong@flow.app)" value={email}
              onChange={e => setEmail(e.target.value)} autoComplete="email" />
            <input className="field-input" type="password" placeholder="Mật khẩu (tối thiểu 6 ký tự)" value={password}
              onChange={e => setPassword(e.target.value)} autoComplete={mode === "signup" ? "new-password" : "current-password"} />
            {msg && <div className={"auth-msg " + (err ? "err" : "ok")}>{msg}</div>}
            <button className="btn-solid" type="submit" disabled={busy}>
              {busy ? "Đang xử lý..." : mode === "signin" ? "Đăng nhập" : "Tạo tài khoản"}
            </button>
          </form>
          <div className="auth-skip">Chưa muốn đăng nhập? <button type="button" onClick={onSkip}>Dùng offline (không đồng bộ)</button></div>
        </div>
      </div>
    </div>
  );
}

/* ---------- App ---------- */
function loadLS(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}

function App() {
  const [theme, setTheme] = useState(() => loadLS("flow_theme", "light"));
  const [view, setView] = useState("dashboard");
  const [tasks, setTasks] = useState(() => loadLS("flow_tasks", seedTasks));
  const [notes, setNotes] = useState(() => loadLS("flow_notes", seedNotes));
  const [goals, setGoals] = useState(() => loadLS("flow_goals", seedGoals));
  const [focusMinutes, setFocusMinutes] = useState(() => {
    const saved = loadLS("flow_focus", null);
    return saved && saved.date === todayISO ? saved.minutes : 0;
  });

  // Auth / sync state
  const [session, setSession] = useState(null);
  const [authReady, setAuthReady] = useState(!HAS_SUPABASE);
  const [localOnly, setLocalOnly] = useState(false);
  const cloud = HAS_SUPABASE && !!session && !localOnly;
  const uid = session && session.user ? session.user.id : null;

  useEffect(() => { localStorage.setItem("flow_theme", JSON.stringify(theme)); }, [theme]);
  useEffect(() => { localStorage.setItem("flow_tasks", JSON.stringify(tasks)); }, [tasks]);
  useEffect(() => { localStorage.setItem("flow_notes", JSON.stringify(notes)); }, [notes]);
  useEffect(() => { localStorage.setItem("flow_goals", JSON.stringify(goals)); }, [goals]);
  useEffect(() => { localStorage.setItem("flow_focus", JSON.stringify({ date: todayISO, minutes: focusMinutes })); }, [focusMinutes]);
  useEffect(() => {
    const ids = [...tasks, ...notes, ...goals].map(x => x.id).filter(x => typeof x === "number");
    const maxId = ids.length ? Math.max(...ids) : 999;
    if (maxId >= idCounter) idCounter = maxId + 1;
  }, []);

  // Bootstrap Supabase auth session + listen for changes (magic link redirect)
  useEffect(() => {
    if (!HAS_SUPABASE) return;
    sb.auth.getSession().then(({ data }) => { setSession(data.session); setAuthReady(true); });
    const { data: sub } = sb.auth.onAuthStateChange((_event, s) => { setSession(s); setAuthReady(true); });
    return () => { sub.subscription.unsubscribe(); };
  }, []);

  // Load data from cloud whenever a logged-in session is active
  useEffect(() => {
    if (!cloud) return;
    let cancelled = false;
    (async () => {
      const [tr, nr, gr] = await Promise.all([
        sb.from("tasks").select("*").order("date").order("time"),
        sb.from("notes").select("*").order("date", { ascending: false }),
        sb.from("goals").select("*").order("created_at")
      ]);
      if (cancelled) return;
      if (!tr.error && tr.data) setTasks(tr.data.map(rowToTask));
      if (!nr.error && nr.data) setNotes(nr.data.map(rowToNote));
      if (!gr.error && gr.data) setGoals(gr.data.map(rowToGoal));
    })();
    return () => { cancelled = true; };
  }, [cloud, uid]);

  const [taskModal, setTaskModal] = useState(null); // {mode:'new'|'edit', task, presetDate}
  const [noteModal, setNoteModal] = useState(null);
  const [goalModal, setGoalModal] = useState(null);
  const [dataModal, setDataModal] = useState(false);
  const [moreOpen, setMoreOpen] = useState(false);

  function alertSync(error) {
    console.error("[Flow sync]", error);
    alert("Lỗi đồng bộ: " + (error && error.message ? error.message : "không rõ") + "\nDữ liệu có thể chưa được lưu lên cloud.");
  }

  const NAV = [
    { key: "dashboard", label: "Dashboard", icon: "grid" },
    { key: "calendar", label: "Lịch", icon: "calendar" },
    { key: "tasks", label: "Công việc", icon: "tasks" },
    { key: "notes", label: "Ghi chú", icon: "note" },
    { key: "pomodoro", label: "Pomodoro", icon: "timer" },
    { key: "goals", label: "Mục tiêu", icon: "target" },
    { key: "stats", label: "Thống kê", icon: "bar" },
  ];
  const titles = { dashboard:["Dashboard","Tổng quan công việc hôm nay"], calendar:["Lịch làm việc","Xem theo ngày, tuần hoặc tháng"], tasks:["Công việc","Kéo thả để cập nhật trạng thái"], notes:["Ghi chú","Lưu lại ý tưởng & ghi chú nhanh"], pomodoro:["Pomodoro","Tập trung sâu theo phiên 25 phút"], goals:["Mục tiêu cá nhân","Theo dõi tiến độ các mục tiêu"], stats:["Thống kê hiệu suất","Nhìn lại quá trình làm việc"] };

  async function saveTask(form) {
    if (cloud) {
      if (form.id) {
        const { data, error } = await sb.from("tasks").update(taskToRow(form)).eq("id", form.id).select().single();
        if (!error && data) setTasks(ts => ts.map(t => t.id === form.id ? rowToTask(data) : t)); else return alertSync(error);
      } else {
        const { data, error } = await sb.from("tasks").insert(taskToRow(form)).select().single();
        if (!error && data) setTasks(ts => [...ts, rowToTask(data)]); else return alertSync(error);
      }
    } else {
      if (form.id) setTasks(ts => ts.map(t => t.id === form.id ? { ...form } : t));
      else setTasks(ts => [...ts, { ...form, id: nextId() }]);
    }
    setTaskModal(null);
  }
  async function deleteTask(id) {
    if (cloud) { const { error } = await sb.from("tasks").delete().eq("id", id); if (error) return alertSync(error); }
    setTasks(ts => ts.filter(t => t.id !== id)); setTaskModal(null);
  }
  async function moveStatus(id, status) {
    setTasks(ts => ts.map(t => t.id === id ? { ...t, status } : t));
    if (cloud) { const { error } = await sb.from("tasks").update({ status }).eq("id", id); if (error) alertSync(error); }
  }

  async function saveNote(form) {
    if (cloud) {
      if (form.id) {
        const { data, error } = await sb.from("notes").update({ ...noteToRow(form), date: todayISO }).eq("id", form.id).select().single();
        if (!error && data) setNotes(ns => ns.map(n => n.id === form.id ? rowToNote(data) : n)); else return alertSync(error);
      } else {
        const { data, error } = await sb.from("notes").insert({ ...noteToRow(form), date: todayISO }).select().single();
        if (!error && data) setNotes(ns => [rowToNote(data), ...ns]); else return alertSync(error);
      }
    } else {
      if (form.id) setNotes(ns => ns.map(n => n.id===form.id ? {...form, date: todayISO} : n));
      else setNotes(ns => [{...form, id: nextId(), date: todayISO}, ...ns]);
    }
    setNoteModal(null);
  }
  async function deleteNote(id) {
    if (cloud) { const { error } = await sb.from("notes").delete().eq("id", id); if (error) return alertSync(error); }
    setNotes(ns => ns.filter(n=>n.id!==id)); setNoteModal(null);
  }

  async function saveGoal(form) {
    if (cloud) {
      if (form.id) {
        const { data, error } = await sb.from("goals").update(goalToRow(form)).eq("id", form.id).select().single();
        if (!error && data) setGoals(gs => gs.map(g => g.id===form.id ? rowToGoal(data) : g)); else return alertSync(error);
      } else {
        const { data, error } = await sb.from("goals").insert(goalToRow(form)).select().single();
        if (!error && data) setGoals(gs => [...gs, rowToGoal(data)]); else return alertSync(error);
      }
    } else {
      if (form.id) setGoals(gs => gs.map(g => g.id===form.id ? {...form} : g));
      else setGoals(gs => [...gs, {...form, id: nextId()}]);
    }
    setGoalModal(null);
  }
  async function deleteGoal(id) {
    if (cloud) { const { error } = await sb.from("goals").delete().eq("id", id); if (error) return alertSync(error); }
    setGoals(gs => gs.filter(g=>g.id!==id)); setGoalModal(null);
  }

  async function signOut() {
    if (sb) await sb.auth.signOut();
    setSession(null); setLocalOnly(false);
  }

  function doExport() { exportExcel(tasks, notes, goals); }

  async function importFile(file) {
    let parsed;
    try { parsed = await parseExcelFile(file); }
    catch (e) { console.error(e); alert("Không đọc được file. Hãy dùng file .xlsx đúng mẫu (xuất từ nút Xuất Excel)."); return; }
    const { tasks: it, notes: inn, goals: ig } = parsed;
    if (!it.length && !inn.length && !ig.length) { alert("Không tìm thấy dòng nào có dữ liệu trong file."); return; }
    if (cloud) {
      try {
        if (it.length)  { const { data, error } = await sb.from("tasks").insert(it.map(taskToRow)).select(); if (error) throw error; setTasks(ts => [...ts, ...data.map(rowToTask)]); }
        if (inn.length) { const { data, error } = await sb.from("notes").insert(inn.map(noteToRow)).select(); if (error) throw error; setNotes(ns => [...data.map(rowToNote), ...ns]); }
        if (ig.length)  { const { data, error } = await sb.from("goals").insert(ig.map(goalToRow)).select(); if (error) throw error; setGoals(gs => [...gs, ...data.map(rowToGoal)]); }
      } catch (e) { return alertSync(e); }
    } else {
      if (it.length)  setTasks(ts => [...ts, ...it.map(x => ({ ...x, id: nextId() }))]);
      if (inn.length) setNotes(ns => [...inn.map(x => ({ ...x, id: nextId() })), ...ns]);
      if (ig.length)  setGoals(gs => [...gs, ...ig.map(x => ({ ...x, id: nextId() }))]);
    }
    setDataModal(false);
    alert(`Đã nhập: ${it.length} công việc, ${inn.length} ghi chú, ${ig.length} mục tiêu.`);
  }

  async function importWeekly(file, startISO, weeks) {
    const w = Math.max(1, Math.min(52, weeks || 4));
    let items;
    try { items = await parseWeeklyTemplate(file); }
    catch (e) { console.error(e); alert("Không đọc được file lịch lặp. Hãy dùng file .xlsx theo mẫu (nút Xuất mẫu lịch)."); return; }
    if (!items.length) { alert("Không tìm thấy khung lịch nào (cần cột Thứ + Tên công việc)."); return; }
    const gen = generateFromWeekly(items, startISO || todayISO, w);
    if (cloud) {
      try { const { data, error } = await sb.from("tasks").insert(gen.map(taskToRow)).select(); if (error) throw error; setTasks(ts => [...ts, ...data.map(rowToTask)]); }
      catch (e) { return alertSync(e); }
    } else {
      setTasks(ts => [...ts, ...gen.map(x => ({ ...x, id: nextId() }))]);
    }
    setDataModal(false);
    alert(`Đã tạo ${gen.length} công việc từ ${items.length} khung lịch × ${w} tuần.`);
  }

  // Loading / auth gate
  if (HAS_SUPABASE && !authReady) {
    return <div id="app-root" data-theme={theme}><div className="auth-wrap"><div style={{color:"var(--text-faint)",fontWeight:600}}>Đang tải…</div></div></div>;
  }
  if (HAS_SUPABASE && !session && !localOnly) {
    return <AuthGate theme={theme} onSkip={() => setLocalOnly(true)} />;
  }

  return (
    <div id="app-root" data-theme={theme}>
      <div className="shell">
        <aside className="sidebar">
          <div className="brand">
            <div className="brand-mark"><Icon name="target" size={17} strokeWidth={2.4} /></div>
            <div className="brand-name">Flow</div>
          </div>
          <nav className="nav">
            {NAV.map(n => (
              <button key={n.key} className={"nav-item" + (view===n.key?" active":"")} onClick={()=>setView(n.key)}>
                <Icon name={n.icon} size={17}/> {n.label}
              </button>
            ))}
          </nav>
          <div className="sidebar-foot">
            <div className="streak"><Icon name="flame" size={14}/> {tasks.filter(t=>t.status==="done").length} việc đã hoàn thành</div>
            <button className="logout-btn" onClick={()=>setDataModal(true)}><Icon name="sheet" size={13}/> Dữ liệu Excel</button>
            {cloud && session && (
              <>
                <div className="sync-row"><Icon name="check" size={13}/> {session.user.email}</div>
                <button className="logout-btn" onClick={signOut}><Icon name="x" size={13}/> Đăng xuất</button>
              </>
            )}
            {HAS_SUPABASE && localOnly && (
              <button className="logout-btn" onClick={()=>setLocalOnly(false)}><Icon name="target" size={13}/> Đăng nhập để đồng bộ</button>
            )}
          </div>
        </aside>

        <div className="main">
          <div className="topbar">
            <div>
              <div className="page-title">{titles[view][0]}</div>
              <div className="page-sub">{titles[view][1]}</div>
            </div>
            <div className="topbar-right">
              <div className="searchbox"><Icon name="search" size={14}/><input placeholder="Tìm công việc..."/></div>
              <button className="icon-btn" onClick={()=>setTheme(t=>t==="light"?"dark":"light")}>
                <Icon name={theme==="light"?"moon":"sun"} size={17}/>
              </button>
              <button className="btn-primary" onClick={()=>setTaskModal({mode:"new"})}><Icon name="plus" size={15}/> Thêm việc</button>
            </div>
          </div>

          <div className="content">
            {view === "dashboard" && <Dashboard tasks={tasks} focusMinutes={focusMinutes} goToTasks={()=>setView("tasks")} />}
            {view === "calendar" && <CalendarView tasks={tasks} onEditTask={t=>setTaskModal({mode:"edit", task:t})} openNewTask={d=>setTaskModal({mode:"new", presetDate:d})} />}
            {view === "tasks" && <TasksView tasks={tasks} onEditTask={t=>setTaskModal({mode:"edit", task:t})} onMoveStatus={moveStatus} onDeleteTask={deleteTask} />}
            {view === "notes" && <NotesView notes={notes} onEdit={n=>setNoteModal(n)} onNew={()=>setNoteModal({mode:"new"})} />}
            {view === "pomodoro" && <PomodoroView onSessionComplete={m=>setFocusMinutes(v=>v+m)} />}
            {view === "goals" && <GoalsView goals={goals} onEdit={g=>setGoalModal(g)} onNew={()=>setGoalModal({mode:"new"})} />}
            {view === "stats" && <StatsView tasks={tasks} />}
          </div>
        </div>
      </div>

      <div className="bottom-nav">
        {NAV.slice(0,4).map(n => (
          <button key={n.key} className={"bn-item" + (view===n.key?" active":"")} onClick={()=>setView(n.key)}>
            <Icon name={n.icon} size={19}/>
            {n.label}
          </button>
        ))}
        <button className={"bn-item" + (["pomodoro","goals","stats"].includes(view)?" active":"")} onClick={()=>setMoreOpen(true)}>
          <Icon name="more" size={19}/>
          Thêm
        </button>
      </div>

      {taskModal && (
        <TaskModal
          initial={taskModal.mode === "edit" ? taskModal.task : (taskModal.presetDate ? {title:"",desc:"",date:taskModal.presetDate,time:"09:00",priority:"med",status:"todo",cat:"ppc"} : null)}
          onClose={()=>setTaskModal(null)}
          onSave={saveTask}
          onDelete={deleteTask}
        />
      )}
      {noteModal && (
        <NoteModal
          initial={noteModal.mode === "new" ? null : noteModal}
          onClose={()=>setNoteModal(null)}
          onSave={saveNote}
          onDelete={deleteNote}
        />
      )}
      {goalModal && (
        <GoalModal
          initial={goalModal.mode === "new" ? null : goalModal}
          onClose={()=>setGoalModal(null)}
          onSave={saveGoal}
          onDelete={deleteGoal}
        />
      )}
      {dataModal && <DataModal onClose={()=>setDataModal(false)} onExport={doExport} onImportFile={importFile} onExportWeekly={exportWeeklyTemplate} onImportWeekly={importWeekly} />}
      {moreOpen && (
        <MoreSheet
          view={view} setView={setView} theme={theme}
          toggleTheme={()=>setTheme(t=>t==="light"?"dark":"light")}
          openData={()=>setDataModal(true)}
          cloud={cloud} session={session} localOnly={localOnly}
          onSignOut={signOut} onLogin={()=>setLocalOnly(false)}
          onClose={()=>setMoreOpen(false)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
